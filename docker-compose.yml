services:
  site:
    build: .
    ports:
      - "4000:4000"      # the site itself — http://localhost:4000
      - "35729:35729"    # livereload — auto-refreshes your browser on save
    volumes:
      - .:/site                        # live-mount your files into the container
      - bundle_cache:/usr/local/bundle  # keeps installed gems between restarts

volumes:
  bundle_cache:
