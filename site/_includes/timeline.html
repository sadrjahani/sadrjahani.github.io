<!--
  Reusable timeline block. Call with:
    include timeline.html, passing rows=<some _data array>
  Each row needs: years, role, org, and optionally description.
-->
<div class="timeline reveal">
  {% for row in include.rows %}
  <div class="t-row">
    <div class="t-year">{{ row.years }}</div>
    <div>
      <div class="t-role">{{ row.role }}</div>
      <div class="t-org">{{ row.org }}</div>
      {% if row.description %}<p class="t-desc">{{ row.description }}</p>{% endif %}
    </div>
  </div>
  {% endfor %}
</div>
