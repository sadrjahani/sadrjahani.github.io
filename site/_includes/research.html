<div class="page-header">
  <h1>{{ site.data.research.title }}</h1>
  <p class="lede">{{ site.data.research.lede }}</p>
</div>

  <section>
    <div class="about-grid reveal">
      <div class="about-copy">
        {% for p in site.data.research.paragraphs %}<p>{{ p }}</p>{% endfor %}
      </div>
      <div class="focus-list">
        {% for item in site.data.research.focus %}
        <div class="focus-item">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
