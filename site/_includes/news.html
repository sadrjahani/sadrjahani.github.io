<div class="page-header">
  <h1>Updates</h1>
  <p class="lede">Recent milestones — roles, degrees, and things worth noting as they happen.</p>
</div>

  <section>
    <div class="news-list reveal">
      {% for item in site.data.news %}
      <div class="news-row">
        <div class="news-date">{{ item.date }}</div>
        <p class="news-body">{{ item.html }}</p>
      </div>
      {% endfor %}
    </div>
  </section>
