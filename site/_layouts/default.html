<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.url == "/" %}{% include person-jsonld.html %}{% endif %}
</head>
<body>

{% include header-nav.html %}

<main>
{{ content }}
</main>

{% if page.show_footer_cta %}{% include footer-cta.html %}{% endif %}

<footer class="site-footer">
  <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
  <span>Portfolio</span>
</footer>

<button class="to-top" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg></button>

<script src="{{ '/assets/js/portfolio.js' | relative_url }}"></script>
</body>
</html>
