# --- Jekyll build settings ---
markdown: kramdown
kramdown:
  input: GFM              # enables pipe tables, footnotes, fenced code — used throughout _research/*.md
  syntax_highlighter: rouge
permalink: pretty

# Each project write-up gets its own file in _research/ and its own page
# under /projects/, e.g. _research/my-project.md ->
# /projects/my-project/. Project cards on the Projects page
# link here for the full write-up (math, images, code, pseudocode, etc.
# — see /projects/style-guide/ for every available formatting option).
collections:
  research:
    output: true
    permalink: /projects/:slug/

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SETUP.md
  - guide.md              # internal how-it-works page — not for the public portfolio
  - _research/style-guide.md
  - Dockerfile
  - docker-compose.yml
  - vendor/
  - node_modules/
